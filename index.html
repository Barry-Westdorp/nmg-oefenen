<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NmG Oefenen</title>
<meta name="description" content="Oefen NmG-gebaren met je eigen woordenlijsten. Alles blijft op je eigen apparaat.">
<meta name="theme-color" content="#4A3ECF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NmG Oefenen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: one calm column for lists, one big card for practice; large tap targets for iPad. */
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --surface-2:#ECEDF7; --ink:#1D1B3B; --muted:#61627E; --line:#DEDFEC;
  --accent:#4A3ECF; --accent-ink:#FFFFFF; --accent-soft:#E6E3FB; --hand:#FF9A52; --fris:#E0701F; --fris-soft:#FDE6D3;
  --good:#18925F; --good-soft:#DDF3E8; --warn:#C98A12; --warn-soft:#FBEFD4; --bad:#CF3F58; --bad-soft:#FBE1E6; --new:#B9BBD0;
  --f-display:ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#121224; --surface:#1C1C33; --surface-2:#26263F; --ink:#EDEDF8; --muted:#A3A4C0; --line:#33344F;
  --accent:#8C82FF; --accent-ink:#13122A; --accent-soft:#2C2858; --hand:#FFAD70; --fris:#FF9F5C; --fris-soft:#3F2A1A;
  --good:#45C98F; --good-soft:#173A2C; --warn:#F0B84A; --warn-soft:#3B3017; --bad:#FF7088; --bad-soft:#40202A; --new:#55577A;
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px)}
.wrap{max-width:860px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px 56px; display:flex; flex-direction:column; gap:20px}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-0.01em}
h1{font-size:clamp(1.8rem, 4vw, 2.4rem); font-weight:800}
h2{font-size:1.3rem; font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.between{justify-content:space-between}
.brand{display:flex; align-items:center; gap:12px}
.mark{width:44px; height:44px; border-radius:12px; background:var(--accent); display:grid; place-items:center; flex:none}
.mark svg{width:26px; height:26px}
.eyebrow{font-size:.78rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

.btn{font:inherit; font-weight:700; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px; min-height:46px; padding:0 18px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,.card-btn:focus-visible{outline:3px solid var(--hand); outline-offset:2px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45; cursor:not-allowed}
.btn.ghost{background:transparent; border-color:transparent; padding:0 10px}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad); border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad); color:#fff; border-color:var(--bad)}
.btn.big{min-height:58px; font-size:1.1rem; padding:0 26px}
.btn.sm{min-height:38px; padding:0 12px; font-size:.92rem}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; display:flex; flex-direction:column; gap:14px}
.note{background:var(--accent-soft); border-radius:12px; padding:12px 14px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.note.err{background:var(--bad-soft)}

.stats{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.stat b{display:block; font-family:var(--f-display); font-size:1.6rem; font-variant-numeric:tabular-nums; line-height:1.1}
.stat span{font-size:.85rem; color:var(--muted); display:flex; align-items:center; gap:6px}
.dot{width:10px; height:10px; border-radius:50%; display:inline-block; flex:none}
.d-gekend{background:var(--good)} .d-opfrissen{background:var(--fris)} .d-bijna{background:var(--warn)} .d-lastig{background:var(--bad)} .d-nieuw{background:var(--new)}

.lists{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px}
.card-btn{font:inherit; color:inherit; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; cursor:pointer; display:flex; flex-direction:column; gap:10px; min-width:0}
.card-btn:hover{border-color:var(--accent)}
.card-btn h3{font-size:1.15rem; overflow-wrap:anywhere}
.bar{display:flex; height:8px; border-radius:99px; overflow:hidden; background:var(--surface-2)}
.bar i{display:block; height:100%}
.bar .s-gekend{background:var(--good)} .bar .s-opfrissen{background:var(--fris)} .bar .s-bijna{background:var(--warn)} .bar .s-lastig{background:var(--bad)} .bar .s-nieuw{background:var(--new)}

.empty{text-align:center; padding:40px 18px; align-items:center}
.empty .mark{width:64px; height:64px; border-radius:18px}
.empty .mark svg{width:38px; height:38px}

label{font-weight:700; font-size:.92rem}
.field{display:flex; flex-direction:column; gap:6px; min-width:0; flex:1 1 200px}
input[type=text], textarea{font:inherit; font-size:16px; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; width:100%; min-height:46px}
textarea{min-height:150px; resize:vertical}
.form-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}

.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{font:inherit; font-weight:700; font-size:.95rem; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:99px; min-height:42px; padding:0 16px; cursor:pointer; display:inline-flex; align-items:center; gap:8px}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.chip .n{font-variant-numeric:tabular-nums; opacity:.75; font-weight:600}

.words{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden}
.word{display:flex; gap:12px; align-items:center; padding:12px 14px; border-top:1px solid var(--line); flex-wrap:wrap}
.word:first-child{border-top:0}
.word .txt{flex:1 1 180px; min-width:0}
.word .txt b{font-size:1.05rem; overflow-wrap:anywhere}
.word .txt p{color:var(--muted); font-size:.9rem; overflow-wrap:anywhere}
.score{font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.tag{font-size:.8rem; font-weight:800; border-radius:99px; padding:3px 10px; white-space:nowrap}
.t-gekend{background:var(--good-soft); color:var(--good)} .t-opfrissen{background:var(--fris-soft); color:var(--fris)} .t-bijna{background:var(--warn-soft); color:var(--warn)} .t-lastig{background:var(--bad-soft); color:var(--bad)} .t-nieuw{background:var(--surface-2); color:var(--muted)}
.word.editing{background:var(--surface-2)}

.confirm{background:var(--bad-soft); border-radius:12px; padding:12px 14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between}
.confirm.ok{background:var(--accent-soft)}

/* Oefenen */
.quiz{display:flex; flex-direction:column; gap:16px; min-height:calc(100vh - 80px); min-height:calc(100dvh - 80px)}
.progress{height:10px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.progress i{display:block; height:100%; background:var(--good); transition:width .3s ease}
.flash{flex:1; min-height:300px; background:var(--surface); border:1px solid var(--line); border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:56px 20px 28px; text-align:center; position:relative}
.flash .from{position:absolute; top:16px; left:18px; right:18px; display:flex; justify-content:space-between; gap:8px}
.flash .wordbig{font-family:var(--f-display); font-weight:800; font-size:clamp(2.4rem, 9vw, 5rem); line-height:1.05; overflow-wrap:anywhere; max-width:100%}
.flash .uitleg{font-size:1.15rem; max-width:34em; background:var(--accent-soft); border-radius:14px; padding:14px 18px; overflow-wrap:anywhere}
.flash.again{border-color:var(--hand); box-shadow:0 0 0 3px color-mix(in srgb, var(--hand) 35%, transparent)}
.answer{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.answer .btn{min-height:84px; font-size:1.25rem; border-radius:18px; border-width:2px}
.btn.no{background:var(--bad-soft); border-color:var(--bad-soft); color:var(--bad)}
.btn.yes{background:var(--good); border-color:var(--good); color:#fff}
.keys{text-align:center; font-size:.85rem; color:var(--muted)}
kbd{font-family:inherit; font-weight:700; border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:0 6px; background:var(--surface)}
.missed{display:flex; flex-direction:column; gap:6px}
.missed > div{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--line)}

/* Gebaren koppelen */
input.url{min-width:0}
.btn.dashed{border-style:dashed; color:var(--accent)}
.btn .n{font-variant-numeric:tabular-nums; opacity:.75; font-weight:600}
.gsec{width:100%; display:flex; flex-direction:column; gap:12px; border-top:1px dashed var(--line); padding-top:14px}
.gsec h3{font-size:1.05rem}
.glinks{display:flex; flex-direction:column; gap:8px}
.glink{display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:8px 10px; flex-wrap:wrap}
.glink.mine{border-color:var(--good)}
.glink .txt{flex:1 1 140px; min-width:0}
.glink .txt p{color:var(--muted); font-size:.85rem; overflow-wrap:anywhere}
.pick{font:inherit; font-size:1.4rem; line-height:1; width:42px; height:42px; border-radius:10px; border:0; background:transparent; color:var(--warn); cursor:pointer; flex:none}
.pick:focus-visible{outline:3px solid var(--hand)}
.gstep{display:flex; gap:12px; align-items:flex-start}
.gstep .num{flex:none; width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-weight:800; display:grid; place-items:center; margin-top:9px}
.gstep > div:not(.form-row){display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-width:0}
a.alt{color:var(--accent); font-weight:700}
.handmatig summary{cursor:pointer; padding:4px 0}

/* Pip */
.pip-card{display:flex; gap:18px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px 20px}
.pip-fig{flex:none; width:120px}
.pip{width:120px; height:120px; display:block; overflow:visible}
.pip-talk{display:flex; flex-direction:column; gap:12px; min-width:0; flex:1}
.bubble{position:relative; background:var(--accent-soft); border-radius:16px; padding:12px 16px; font-size:1.08rem; font-weight:600; align-self:flex-start}
.bubble.big{font-size:1.25rem}
.bubble::before{content:""; position:absolute; left:-9px; top:22px; border:9px solid transparent; border-left:0; border-right-color:var(--accent-soft)}
.empty .pip-fig{margin:0 auto}
.pip .pip-body{animation:pip-bob 3.2s ease-in-out infinite}
.pip .pip-wave{transform-box:fill-box; transform-origin:30% 90%; animation:pip-wave 1.4s ease-in-out 3}
.pip-super .pip-up{animation:pip-jump .9s ease-in-out infinite}
.pip-super .pip-up2{animation-delay:.45s}
.pip-mist .pip-body{animation:none}
@keyframes pip-bob{50%{transform:translateY(-3px)}}
@keyframes pip-wave{0%,100%{transform:rotate(0)} 25%{transform:rotate(-18deg)} 75%{transform:rotate(14deg)}}
@keyframes pip-jump{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){ .pip *{animation:none !important} }
@media (max-width:560px){ .pip-card{flex-direction:column; text-align:left; align-items:stretch} .pip-fig{align-self:center} .bubble::before{display:none} }

/* Lijstkaarten: kleur laat zien wat aandacht nodig heeft */
.card-btn.fris{border-color:var(--fris); background:linear-gradient(var(--fris-soft), var(--surface) 60%)}
.card-btn.groen{border-color:var(--good)}
.card-btn.paused{opacity:.6; border-style:dashed}
.card-btn .tag{flex:none}

/* Melding en koppelbalk */
.toast{position:fixed; z-index:30; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top, 0px) + 12px); max-width:min(92vw, 560px);
  background:var(--good); color:#fff; font-weight:700; padding:12px 18px; border-radius:14px; box-shadow:0 8px 24px rgba(20,18,60,.25)}
.toast.err{background:var(--bad)}
.kb-fb{width:100%; font-weight:700; color:var(--good)}
.kb-fb.err{color:var(--bad)}

/* Dagen op rij */
.streak{display:flex; flex-direction:column; gap:8px}
.flame{width:22px; height:22px; color:var(--new); flex:none}
.streak.on .flame{color:var(--fris)}
.streak.risk .flame{animation:pip-bob 1.2s ease-in-out infinite}
.week{display:flex; gap:6px; flex-wrap:wrap}
.wd{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.72rem; color:var(--muted); min-width:34px}
.wd i{font-style:normal; width:28px; height:28px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:.85rem; font-weight:800; color:#fff}
.wd.ok i{background:var(--fris); border-color:var(--fris)}
.wd.today i{border-style:dashed; border-color:var(--accent)}
.wd.today.ok i{border-style:solid; border-color:var(--fris)}

/* Aan/uit-schakelaar */
.switch{flex:none; width:58px; height:34px; border-radius:99px; border:0; background:var(--new); position:relative; cursor:pointer; padding:0}
.switch span{position:absolute; top:3px; left:3px; width:28px; height:28px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"] span{transform:translateX(24px)}
.switch:focus-visible{outline:3px solid var(--hand); outline-offset:2px}
.koppel-spacer{height:150px}
.koppelbar{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:2px solid var(--accent);
  box-shadow:0 -6px 24px rgba(20,18,60,.12); padding-bottom:env(safe-area-inset-bottom, 0px)}
.koppelbar .inner{max-width:860px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:14px;
  display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.kb-txt{display:flex; flex-direction:column; gap:2px; flex:1 1 280px; min-width:0}

@media (max-width:560px){
  .stats{grid-template-columns:repeat(3, minmax(0,1fr))}
  .answer .btn{min-height:72px; font-size:1.1rem}
  .keys{display:none}
}
@media (hover:none){ .keys{display:none} }
@media (prefers-reduced-motion: reduce){ .progress i{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="backup-file" accept=".json,application/json" hidden>

<script>
(function(){
const $app = document.getElementById('app');
const $file = document.getElementById('backup-file');
const LS = 'nmg-oefenen-v1';
const LS_BACKUP = 'nmg-oefenen-laatste-backup';
const LS_SET = 'nmg-oefenen-instellingen';
const LS_KOPPEL = 'nmg-oefenen-koppel';
const LS_DAGEN = 'nmg-oefenen-dagen';
const ST = {gekend:'Ken ik', opfrissen:'Opfrissen', bijna:'Bijna', lastig:'Lastig', nieuw:'Nieuw'};
const ORDER = ['gekend','opfrissen','bijna','lastig','nieuw'];
const HERHAAL = [[7,'1 week'],[14,'2 weken'],[30,'1 maand'],[90,'3 maanden'],[0,'Nooit']];
const DAY = 86400000;
const SET = {herhaal:14};
let DAGEN = {};           // 'jjjj-mm-dd' -> aantal beantwoorde kaarten die dag
const DAG_MIN = 5;        // zoveel kaarten per dag en de dag telt mee voor je reeks
const MIJLPALEN = [3, 7, 14, 21, 30, 50, 75, 100, 150, 200, 365];
const HAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-ink)" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg>';

const S = {
  lists:new Map(), view:'home', listId:null,
  newList:false, rename:false, bulk:false, editWord:null, wordFilter:'alle', confirm:null,
  setup:{sel:new Set(), filter:'alle', max:0}, quiz:null, msg:null, pendingImport:null, pending:null
};

const mkId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GC = 'https://ow.gebarencentrum.nl';
const zoekUrl = w => GC + '/search?q=' + encodeURIComponent(String(w).trim().toLowerCase());
const normLink = k => ({id:String(k.id||mkId()), url:String(k.url||''), label:String(k.label||'')});
function normWord(w){
  const links = Array.isArray(w.links) ? w.links.map(normLink).filter(k => /^https:\/\//i.test(k.url)) : [];
  const mijn = links.some(k => k.id === w.mijn) ? String(w.mijn) : (links[0] ? links[0].id : null);
  return {id:String(w.id||mkId()), w:String(w.w||''), g:String(w.g||''), goed:+w.goed||0, fout:+w.fout||0, reeks:+w.reeks||0, laatst:w.laatst||null, links, mijn};
}
const mijnLink = w => w.links.find(k => k.id === w.mijn) || w.links[0] || null;
const linkLabel = (w, k) => k.label || (w.links.length > 1 ? 'Gebaar ' + (w.links.indexOf(k) + 1) : 'Gebaar');
const shortUrl = u => u.replace(/^https:\/\/(www\.)?/i, '').slice(0, 60);
const zoekAttr = (listId, wordId) => ` data-a="zoek" data-l="${esc(listId)}" data-id="${esc(wordId)}"`;
const ext = (url, cls, html, extra) => `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener"${extra || ''}>${html}</a>`;
const normList = (id, v) => ({id:String(id), name:String(v.name||'Naamloze lijst'), created:+v.created||0, actief:v.actief !== false, words:Array.isArray(v.words) ? v.words.map(normWord) : []});
const daysSince = iso => { const t = iso ? Date.parse(iso) : NaN; return isNaN(t) ? Infinity : Math.max(0, Math.floor((Date.now() - t) / DAY)); };
// Een gekend woord dat je te lang niet hebt geoefend, moet opgefrist worden.
function status(w){
  if(w.goed + w.fout === 0) return 'nieuw';
  if(w.reeks >= 3) return (SET.herhaal && daysSince(w.laatst) >= SET.herhaal) ? 'opfrissen' : 'gekend';
  if(w.reeks >= 1) return 'bijna';
  return 'lastig';
}
function counts(words){ const c={gekend:0,opfrissen:0,bijna:0,lastig:0,nieuw:0}; for(const w of words) c[status(w)]++; return c; }
const lastPracticed = l => l.words.reduce((m, w) => (w.laatst && (!m || w.laatst > m)) ? w.laatst : m, null);
const activeLists = () => sortedLists().filter(l => l.actief);
const herhaalLabel = d => (HERHAAL.find(x => x[0] === d) || [0, d + ' dagen'])[1];
const dkey = t => { const x = new Date(t); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const telt = k => (DAGEN[k] || 0) >= DAG_MIN;
function saveDagen(){
  const grens = dkey(Date.now() - 400 * DAY);
  for(const k of Object.keys(DAGEN)) if(k < grens) delete DAGEN[k];
  try{ localStorage.setItem(LS_DAGEN, JSON.stringify(DAGEN)); }catch(e){}
}
// Dagen op rij: telt terug vanaf vandaag (of gisteren, als je vandaag nog niet genoeg hebt geoefend).
function streak(){
  const d = new Date(); d.setHours(12, 0, 0, 0);
  const vandaagK = dkey(d), vandaag = telt(vandaagK);
  if(!vandaag) d.setDate(d.getDate() - 1);
  let n = 0; while(telt(dkey(d))){ n++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  for(const k of Object.keys(DAGEN).filter(telt).sort()){
    const t = new Date(k + 'T12:00:00');
    run = (prev && Math.round((t - prev) / DAY) === 1) ? run + 1 : 1;
    best = Math.max(best, run); prev = t;
  }
  return {n, vandaag, best, nog:Math.max(0, DAG_MIN - (DAGEN[vandaagK] || 0))};
}

/* ---------- back-up ---------- */
async function makeBackup(){
  const now = new Date();
  const data = {app:'nmg-oefenen', versie:1, gemaakt:now.toISOString(), instellingen:{...SET}, dagen:{...DAGEN}, lijsten:sortedLists()};
  const name = 'nmg-oefenen-backup-' + now.toISOString().slice(0,10) + '.json';
  const file = new File([JSON.stringify(data, null, 1)], name, {type:'application/json'});
  const done = () => { try{ localStorage.setItem(LS_BACKUP, now.toISOString()); }catch(e){} S.msg = {t:'Back-up gemaakt: ' + name}; render(); };
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'NmG Oefenen back-up'});
      done(); return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return; // gebruiker heeft geannuleerd
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  done();
}

function render(opts){

  const act = document.activeElement;
  if(act && act.id && $app.contains(act)){ focusId = act.id; try{ sS = act.selectionStart; sE = act.selectionEnd; }catch(e){} }

  for(const k in keep){ if(reset.has(k)) continue; const el = document.getElementById(k); if(el) el.value = keep[k]; }

  if(f){ const el = document.getElementById(f); if(el){ el.focus({preventScroll:!opts.focus}); if(!opts.focus && sS != null){ try{ el.setSelectionRange(sS, sE); }catch(e){} } } }

function addLink(listId, wordId, text, label){

function dagPick(arr){ return arr[Math.floor(Date.now() / DAY) % arr.length]; }
function pipInfo(){
  const act = activeLists();
  const words = act.flatMap(l => l.words);
  const c = counts(words), n = words.length;
  const last = act.reduce((m, l) => Math.min(m, daysSince(lastPracticed(l))), Infinity);
  const todo = n - c.gekend;
  const fris = act.filter(l => counts(l.words).opfrissen).sort((a, b) => counts(b.words).opfrissen - counts(a.words).opfrissen)[0];
  let m, t;
  if(!n){ m = 'nieuw'; t = act.length ? 'Zet een paar woorden in je lijst, dan gaan we oefenen!' : 'Er doet nu geen lijst mee. Zet een lijst aan, dan help ik je oefenen.'; }
  else if(last === Infinity){ m = 'nieuw'; t = dagPick(['Hoi, ik ben Pip! Zullen we samen beginnen?', 'Hoi! Ik ben Pip. Klaar voor je eerste ronde?']); }
  else if(last >= Math.max(7, SET.herhaal || 14)){ m = 'mist'; t = dagPick(['Ik mis je! Het is al ' + last + ' dagen geleden.', 'Hé, kom je weer oefenen? Je gebaren wachten op je.', 'Al ' + last + ' dagen niet geoefend… Vijf minuutjes samen?']); }
  else if(c.gekend / n >= 0.8 && !c.opfrissen && !c.lastig){ m = 'super'; t = todo ? dagPick(['Wauw, bijna alles is groen! Nog ' + todo + ' te gaan.', 'Wat ken jij al veel gebaren! Ik ben trots op je.']) : dagPick(['Alles is groen! Je bent een kanjer.', 'Alles groen! Kort herhalen houdt het zo.']); }
  else if(c.opfrissen >= Math.max(3, n * 0.25) || last >= 4){ m = 'twijfel'; t = c.opfrissen ? (c.opfrissen + ' ' + (c.opfrissen === 1 ? 'woord wordt' : 'woorden worden') + ' een beetje vergeten' + (fris ? ', vooral in "' + fris.name + '"' : '') + '. Even opfrissen?') : 'Het is al ' + last + ' dagen stil. Zullen we even oefenen?'; }
  else { m = 'blij'; t = dagPick(['Goed bezig! Nog ' + todo + ' ' + (todo === 1 ? 'woord' : 'woorden') + ' en alles is groen.', 'Fijn dat je oefent! Zullen we er nog een paar doen?', 'Lekker bezig. Elke ronde maakt het makkelijker.']); }
  const st = streak();
  if(n && st.n >= 2 && !st.vandaag && m !== 'mist') t = 'Je zit op ' + st.n + ' dagen op rij! Oefen vandaag nog ' + st.nog + ' ' + (st.nog === 1 ? 'kaart' : 'kaarten') + ', dan houd je je reeks.';
  else if(n && st.vandaag && st.n >= 3 && m !== 'mist' && m !== 'twijfel') t = dagPick([st.n + ' dagen op rij, wat goed van je!', 'Vandaag telt al mee. ' + st.n + ' dagen op rij!', t]);
  return {m, t, c, n, todo, act};
}
// Een ronde voor Pip: eerst wat opgefrist moet worden en wat lastig is, maximaal 20 woorden.
function pipRonde(info){
  const rank = {opfrissen:0, lastig:1, bijna:2, nieuw:3, gekend:4};
  let items = [];
  for(const l of info.act) for(const w of l.words) items.push({l:l.id, w:w.id, r:rank[status(w)]});
  const todo = items.filter(x => x.r < 4);
  items = todo.length ? todo : items;
  shuffle(items).sort((a, b) => a.r - b.r);
  return items.slice(0, todo.length ? 20 : 10).map(({l, w}) => ({l, w}));
}

    </div>

    <p class="keys">Toetsen: <kbd>←</kbd> weet ik niet · <kbd>→</kbd> weet ik${w.g ? ' · <kbd>spatie</kbd> toon gebaar' : ''}</p></div>`;

function viewDone(){
  const q = S.quiz;
  const missed = [...q.missed.entries()].map(([k, n]) => { const [l, w] = k.split(':'); return {it:{l, w}, n}; }).filter(x => findWord(x.it));
  const finished = !q.queue.length;
  const ratio = q.total ? q.firstTry / q.total : 0;
  let pm = 'blij', pt;
  if(!finished) { if(q.done){ pt = 'Fijn dat je even geoefend hebt! Alles wat je wist, is bewaard.'; } else { pm = 'twijfel'; pt = 'Geen tijd? Geeft niks, volgende keer verder.'; } }
  else if(ratio >= 0.8){ pm = 'super'; pt = dagPick(['Geweldig! ' + q.firstTry + ' van de ' + q.total + ' in één keer goed.', 'Wauw, wat ging dat goed!']); }
  else if(ratio >= 0.5){ pt = 'Goed gedaan! De lastige woorden oefenen we gewoon nog een keer.'; }
  else { pt = 'Knap dat je doorzet! Met elke ronde wordt het makkelijker.'; }
  if(q.streakNu){
    if(MIJLPALEN.includes(q.streakNu)){ pm = 'super'; pt = q.streakNu + ' dagen op rij! Dat is een mijlpaal. Ik ben zo trots op je!'; }
    else if(q.streakNu > 1){ pt = 'Vandaag telt mee: ' + q.streakNu + ' dagen op rij! ' + pt; }
    else { pt = 'Je reeks is begonnen! Kom morgen weer, dan wordt het 2 dagen op rij.'; }
  }
  let h = `<header><p class="eyebrow">${finished ? 'Ronde klaar' : 'Gestopt'}</p></header>
    <section class="pip-card"><div class="pip-fig">${pipSvg(pm)}</div><div class="pip-talk"><p class="bubble big">${esc(pt)}</p>${streakHtml()}</div></section>`;
  h += `<section class="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    <div class="stat"><b>${q.firstTry}</b><span>in één keer goed</span></div>
    <div class="stat"><b>${missed.length}</b><span>moest je herhalen</span></div>
    <div class="stat"><b>${q.done}</b><span>van ${q.total} gekend</span></div></section>`;
  if(missed.length){
    h += `<section class="panel"><h2>Deze woorden waren lastig</h2><div class="missed">` +
      missed.sort((a,b)=>b.n-a.n).map(x => { const w = findWord(x.it), mk = mijnLink(w);
        return `<div><span><b>${esc(w.w)}</b> <span class="muted small">${x.n} keer niet geweten</span></span>${mk ? ext(mk.url, 'btn sm', '▶ Gebaar') : ext(zoekUrl(w.w), 'btn sm ghost', 'Zoek gebaar', zoekAttr(x.it.l, w.id))}</div>`; }).join('') + `</div></section>`;
  }
  h += `<div class="row">${missed.length ? '<button class="btn primary big" data-a="again-missed">Oefen de lastige woorden</button>' : ''}
    <button class="btn${missed.length ? '' : ' primary'} big" data-a="again">Nog een ronde</button><button class="btn big" data-a="home">Naar lijsten</button></div>`;
  return h;
}

/* ---------- acties ---------- */
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startQuiz(items){
  S.quiz = {queue:shuffle(items.slice()), total:items.length, done:0, firstTry:0, missed:new Map(), revealed:false};
  S.view = 'quiz'; window.scrollTo(0,0); render();
}
function answer(known){
  const q = S.quiz; if(!q || !q.queue.length) return;
  const it = q.queue.shift(); const w = findWord(it);
  if(!w){ render(); return; }
  if(known){ w.goed++; w.reeks++; } else { w.fout++; w.reeks = 0; }
  w.laatst = new Date().toISOString();
  save();
  // Dagen op rij: na DAG_MIN kaarten telt vandaag mee.
  const vk = dkey(Date.now()); DAGEN[vk] = (DAGEN[vk] || 0) + 1; saveDagen();
  if(DAGEN[vk] === DAG_MIN){ const st = streak(); q.streakNu = st.n; toast(st.n > 1 ? 'Vandaag telt mee: ' + st.n + ' dagen op rij!' : 'Vandaag telt mee! Je reeks is begonnen.'); }
  const key = it.l + ':' + it.w;
  if(known){ q.done++; if(!q.missed.has(key)) q.firstTry++; }
  else {
    q.missed.set(key, (q.missed.get(key) || 0) + 1);
    // Niet geweten: een paar kaarten later komt het woord terug.
    const pos = Math.min(q.queue.length, 2 + Math.floor(Math.random() * 3));
    q.queue.splice(pos, 0, it);
  }
  q.revealed = false;
  if(!q.queue.length) S.view = 'done';
  render();
}
function createList(name){
  const id = mkId();
  S.lists.set(id, {id, name, created:Date.now(), words:[]});
  save(); return id;
}
function addWords(l, items){
  const have = new Set(l.words.map(w => w.w.trim().toLowerCase()));
  let added = 0, skipped = 0;
  for(const {w, g} of items){
    const k = w.trim().toLowerCase(); if(!k) continue;
    if(have.has(k)){ skipped++; continue; }
    have.add(k); l.words.push(normWord({w:w.trim(), g:g.trim()})); added++;
  }
  if(added) save();
  return {added, skipped};
}

    case 'toggle-actief': if(l){ l.actief = !l.actief; save(); } break;
    case 'pip-start': { const items = pipRonde(pipInfo()); if(items.length){ S.msg = null; startQuiz(items); return; } break; }
    case 'home': S.view = 'home'; S.confirm = null; S.editWord = null; S.rename = false; S.newList = false; S.quiz = null; window.scrollTo(0,0); break;
    case 'newlist': S.newList = true; render({focus:'nl-name'}); return;
    case 'newlist-cancel': S.newList = false; break;
    case 'sample': {
      const nid = createList('Voorbeeld: begroeten');
      addWords(S.lists.get(nid), ['hallo','dag','goedemorgen','welterusten','dank je wel','alsjeblieft','sorry','ja','nee','hoe gaat het'].map(w => ({w, g:''})));
      S.msg = {t:'Voorbeeldlijst toegevoegd. Open hem om bij elk woord te schrijven hoe het gebaar gaat.'};
      break;
    }
    case 'backup': makeBackup(); return;
    case 'restore': $file.click(); return;
    case 'import-no': S.pendingImport = null; S.confirm = null; break;
    case 'import-yes': {
      const p = S.pendingImport;
      if(p){ for(const nl of p.lists) S.lists.set(nl.id, nl); save(); if(p.instellingen && typeof p.instellingen.herhaal === 'number'){ SET.herhaal = p.instellingen.herhaal; saveSettings(); } if(p.dagen && typeof p.dagen === 'object'){ for(const [k, v] of Object.entries(p.dagen)) if(/^\d{4}-\d\d-\d\d$/.test(k)) DAGEN[k] = Math.max(DAGEN[k] || 0, +v || 0); saveDagen(); } S.msg = {t:plural(p.lists.length,'lijst','lijsten') + ' teruggezet.'}; }
      S.pendingImport = null; S.confirm = null; window.scrollTo(0,0); break;
    }
    case 'open': S.view = 'list'; S.listId = id; S.confirm = null; S.editWord = null; S.rename = false; S.wordFilter = 'alle'; S.msg = null; window.scrollTo(0,0); break;
    case 'rename': S.rename = true; render({focus:'rn-name'}); return;
    case 'rename-cancel': S.rename = false; break;
    case 'bulk': S.bulk = !S.bulk; render({focus: S.bulk ? 'bk-text' : 'nw-woord'}); return;
    case 'wfilter': S.wordFilter = v; break;
    case 'edit': S.editWord = id; S.confirm = null; render({focus:'ew-' + id}); return;
    case 'edit-cancel': S.editWord = null; break;
    case 'zoek': // de link opent zelf het Gebarencentrum; de app zet de koppelbalk klaar voor als je terugkomt
      setPending({l:b.dataset.l || S.listId, w:id});
      if(S.view === 'list'){ S.editWord = id; S.confirm = null; }
      setTimeout(() => render(), 0); return;
    case 'koppel-stop': setPending(null); break;
    case 'koppel-zelf': S.koppelZelf = true; S.koppelFb = null; render({focus:'kb-url'}); return;
    case 'koppel': case 'paste': {
      const target = a === 'koppel' ? S.pending : {l:S.listId, w:id};
      if(!target) break;
      const labEl = a === 'paste' ? document.getElementById('lk-lab-' + id) : null;
      readClipboard().then(t => {
        if(t === null || t === ''){
          // Geen toegang tot het klembord: laat de gebruiker zelf plakken in de balk.
          setPending(target);
          S.koppelZelf = true;
          S.koppelFb = {err:true, t: t === '' ? 'Je klembord is leeg. Kopieer eerst de link bij het Gebarencentrum.' : 'Je iPad gaf het klembord niet vrij. Houd je vinger in het vak hieronder en kies Plak.'};
          render({focus:'kb-url'}); return;
        }
        linkResult(target, addLink(target.l, target.w, t, labEl ? labEl.value : ''), labEl ? [labEl.id] : []);
      });
      return;
    }
    case 'mijn': case 'del-link': {
      const w = l && l.words.find(x => x.id === S.editWord); if(!w) break;
      if(a === 'mijn') w.mijn = id;
      else { w.links = w.links.filter(k => k.id !== id); if(w.mijn === id) w.mijn = w.links[0] ? w.links[0].id : null; }
      save(); break;
    }
    case 'ask-word': S.confirm = 'word:' + id; S.editWord = null; break;
    case 'ask-reset': S.confirm = 'reset'; break;
    case 'ask-list': S.confirm = 'list'; break;
    case 'confirm-no': S.confirm = null; break;
    case 'confirm-yes': {
      if(!l) break;
      if(S.confirm === 'reset'){ for(const w of l.words){ w.goed = 0; w.fout = 0; w.reeks = 0; w.laatst = null; } save(); S.msg = {t:'De voortgang van deze lijst staat weer op nul.'}; }
      else if(S.confirm === 'list'){ S.lists.delete(l.id); save(); S.setup.sel.delete(l.id); S.view = 'home'; S.msg = {t:'Lijst verwijderd.'}; }
      else if(S.confirm && S.confirm.startsWith('word:')){ const wid = S.confirm.slice(5); l.words = l.words.filter(w => w.id !== wid); save(); }
      S.confirm = null; break;
    }
    case 'setup':
      S.setup.sel = new Set(id ? [id] : (activeLists().length ? activeLists() : sortedLists()).map(x => x.id));
      S.view = 'setup'; S.msg = null; S.confirm = null; window.scrollTo(0,0); break;
    case 'sel': S.setup.sel.has(id) ? S.setup.sel.delete(id) : S.setup.sel.add(id); break;
    case 'sel-all': { const ls = sortedLists(); const all = ls.every(x => S.setup.sel.has(x.id)); S.setup.sel = new Set(all ? [] : ls.map(x => x.id)); break; }
    case 'sfilter': S.setup.filter = v; break;
    case 'smax': S.setup.max = +v; break;
    case 'start': { const p = shuffle(pool()); startQuiz(S.setup.max ? p.slice(0, S.setup.max) : p); return; }
    case 'reveal': if(S.quiz) S.quiz.revealed = true; break;
    case 'yes': answer(true); return;
    case 'no': answer(false); return;
    case 'stop': S.view = 'done'; break;
    case 'again': S.view = 'setup'; S.quiz = null; break;
    case 'again-missed': { const items = [...S.quiz.missed.keys()].map(k => { const [ll, w] = k.split(':'); return {l:ll, w}; }).filter(findWord); startQuiz(items); return; }
  }
  render();
});

$app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, l = S.lists.get(S.listId);
  if(f.id === 'f-newlist'){
    const name = document.getElementById('nl-name').value.trim();
    if(!name){ document.getElementById('nl-name').focus(); return; }
    const id = createList(name); S.newList = false;
    S.view = 'list'; S.listId = id; S.bulk = false; S.wordFilter = 'alle'; S.msg = null;
    render({reset:['nl-name'], focus:'nw-woord'}); return;
  }
  if(f.id === 'f-kb'){
    const p = S.pending; if(!p) return;
    const val = document.getElementById('kb-url').value;
    const r = addLink(p.l, p.w, val, '');
    if(!r.ok && !/https:\/\//i.test(val)) r.t = 'Plak een link die begint met https://';
    linkResult(p, r, ['kb-url']); return;
  }
  if(!l) return;
  if(f.id === 'f-rename'){
    const name = document.getElementById('rn-name').value.trim();
    if(name){ l.name = name; save(); }
    S.rename = false; render(); return;
  }
  if(f.id === 'f-add'){
    const w = document.getElementById('nw-woord').value, g = document.getElementById('nw-gebaar').value;
    if(!w.trim()){ document.getElementById('nw-woord').focus(); return; }
    const r = addWords(l, [{w, g}]);
    S.msg = r.added ? null : {t:'"' + w.trim() + '" staat al in deze lijst.', err:true};
    render({reset:r.added ? ['nw-woord','nw-gebaar'] : [], focus:'nw-woord'}); return;
  }
  if(f.id === 'f-bulk'){
    const lines = document.getElementById('bk-text').value.split(/\r?\n/);
    const items = lines.map(s => { const i = s.indexOf('='); return i >= 0 ? {w:s.slice(0,i), g:s.slice(i+1)} : {w:s, g:''}; }).filter(x => x.w.trim());
    if(!items.length){ document.getElementById('bk-text').focus(); return; }
    const r = addWords(l, items);
    S.msg = {t: plural(r.added,'woord','woorden') + ' toegevoegd' + (r.skipped ? ', ' + r.skipped + ' stond' + (r.skipped===1?'':'en') + ' er al in' : '') + '.'};
    S.bulk = false; render({reset:['bk-text']}); return;
  }
  if(f.id === 'f-link'){
    const wid = f.dataset.id, w = l.words.find(x => x.id === wid); if(!w) return;
    const urlEl = document.getElementById('lk-url-' + wid), labEl = document.getElementById('lk-lab-' + wid);
    const r = addLink(l.id, wid, urlEl.value, labEl ? labEl.value : '');
    if(!r.ok && !/https:\/\//i.test(urlEl.value)) r.t = 'Plak een link die begint met https://';
    linkResult({l:l.id, w:wid}, r, ['lk-url-' + wid, 'lk-lab-' + wid]); return;
  }
  if(f.id === 'f-edit'){
    const wid = f.dataset.id, w = l.words.find(x => x.id === wid); if(!w) return;
    const nw = document.getElementById('ew-' + wid).value.trim(), ng = document.getElementById('eg-' + wid).value.trim();
    if(!nw) return;
    w.w = nw; w.g = ng; save(); S.editWord = null; render(); return;
  }
});

document.addEventListener('keydown', e => {
  if(S.view !== 'quiz' || !S.quiz) return;
  const t = e.target; if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); answer(true); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); answer(false); }
  else if(e.key === ' '){ e.preventDefault(); if(!S.quiz.revealed){ S.quiz.revealed = true; render(); } }
});

load();
render();

// Offline werken: de app zelf wordt op het apparaat bewaard.
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
