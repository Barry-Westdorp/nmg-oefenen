<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NmG Oefenen</title>
<meta name="description" content="Oefen NmG-gebaren met je eigen woordenlijsten. Alles blijft op je eigen apparaat.">
<meta name="theme-color" content="#4A3ECF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NmG Oefenen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: one calm column for lists, one big card for practice; large tap targets for iPad. */
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --surface-2:#ECEDF7; --ink:#1D1B3B; --muted:#61627E; --line:#DEDFEC;
  --accent:#4A3ECF; --accent-ink:#FFFFFF; --accent-soft:#E6E3FB; --hand:#FF9A52;
  --good:#18925F; --good-soft:#DDF3E8; --warn:#C98A12; --warn-soft:#FBEFD4; --bad:#CF3F58; --bad-soft:#FBE1E6; --new:#B9BBD0;
  --f-display:ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#121224; --surface:#1C1C33; --surface-2:#26263F; --ink:#EDEDF8; --muted:#A3A4C0; --line:#33344F;
  --accent:#8C82FF; --accent-ink:#13122A; --accent-soft:#2C2858; --hand:#FFAD70;
  --good:#45C98F; --good-soft:#173A2C; --warn:#F0B84A; --warn-soft:#3B3017; --bad:#FF7088; --bad-soft:#40202A; --new:#55577A;
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px)}
.wrap{max-width:860px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px 56px; display:flex; flex-direction:column; gap:20px}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-0.01em}
h1{font-size:clamp(1.8rem, 4vw, 2.4rem); font-weight:800}
h2{font-size:1.3rem; font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.between{justify-content:space-between}
.brand{display:flex; align-items:center; gap:12px}
.mark{width:44px; height:44px; border-radius:12px; background:var(--accent); display:grid; place-items:center; flex:none}
.mark svg{width:26px; height:26px}
.eyebrow{font-size:.78rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

.btn{font:inherit; font-weight:700; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px; min-height:46px; padding:0 18px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,.card-btn:focus-visible{outline:3px solid var(--hand); outline-offset:2px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45; cursor:not-allowed}
.btn.ghost{background:transparent; border-color:transparent; padding:0 10px}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad); border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad); color:#fff; border-color:var(--bad)}
.btn.big{min-height:58px; font-size:1.1rem; padding:0 26px}
.btn.sm{min-height:38px; padding:0 12px; font-size:.92rem}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; display:flex; flex-direction:column; gap:14px}
.note{background:var(--accent-soft); border-radius:12px; padding:12px 14px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.note.err{background:var(--bad-soft)}

.stats{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.stat b{display:block; font-family:var(--f-display); font-size:1.6rem; font-variant-numeric:tabular-nums; line-height:1.1}
.stat span{font-size:.85rem; color:var(--muted); display:flex; align-items:center; gap:6px}
.dot{width:10px; height:10px; border-radius:50%; display:inline-block; flex:none}
.d-gekend{background:var(--good)} .d-bijna{background:var(--warn)} .d-lastig{background:var(--bad)} .d-nieuw{background:var(--new)}

.lists{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px}
.card-btn{font:inherit; color:inherit; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; cursor:pointer; display:flex; flex-direction:column; gap:10px; min-width:0}
.card-btn:hover{border-color:var(--accent)}
.card-btn h3{font-size:1.15rem; overflow-wrap:anywhere}
.bar{display:flex; height:8px; border-radius:99px; overflow:hidden; background:var(--surface-2)}
.bar i{display:block; height:100%}
.bar .s-gekend{background:var(--good)} .bar .s-bijna{background:var(--warn)} .bar .s-lastig{background:var(--bad)} .bar .s-nieuw{background:var(--new)}

.empty{text-align:center; padding:40px 18px; align-items:center}
.empty .mark{width:64px; height:64px; border-radius:18px}
.empty .mark svg{width:38px; height:38px}

label{font-weight:700; font-size:.92rem}
.field{display:flex; flex-direction:column; gap:6px; min-width:0; flex:1 1 200px}
input[type=text], textarea{font:inherit; font-size:16px; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; width:100%; min-height:46px}
textarea{min-height:150px; resize:vertical}
.form-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}

.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{font:inherit; font-weight:700; font-size:.95rem; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:99px; min-height:42px; padding:0 16px; cursor:pointer; display:inline-flex; align-items:center; gap:8px}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.chip .n{font-variant-numeric:tabular-nums; opacity:.75; font-weight:600}

.words{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden}
.word{display:flex; gap:12px; align-items:center; padding:12px 14px; border-top:1px solid var(--line); flex-wrap:wrap}
.word:first-child{border-top:0}
.word .txt{flex:1 1 180px; min-width:0}
.word .txt b{font-size:1.05rem; overflow-wrap:anywhere}
.word .txt p{color:var(--muted); font-size:.9rem; overflow-wrap:anywhere}
.score{font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.tag{font-size:.8rem; font-weight:800; border-radius:99px; padding:3px 10px; white-space:nowrap}
.t-gekend{background:var(--good-soft); color:var(--good)} .t-bijna{background:var(--warn-soft); color:var(--warn)} .t-lastig{background:var(--bad-soft); color:var(--bad)} .t-nieuw{background:var(--surface-2); color:var(--muted)}
.word.editing{background:var(--surface-2)}

.confirm{background:var(--bad-soft); border-radius:12px; padding:12px 14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between}
.confirm.ok{background:var(--accent-soft)}

/* Oefenen */
.quiz{display:flex; flex-direction:column; gap:16px; min-height:calc(100vh - 80px); min-height:calc(100dvh - 80px)}
.progress{height:10px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.progress i{display:block; height:100%; background:var(--good); transition:width .3s ease}
.flash{flex:1; min-height:300px; background:var(--surface); border:1px solid var(--line); border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:56px 20px 28px; text-align:center; position:relative}
.flash .from{position:absolute; top:16px; left:18px; right:18px; display:flex; justify-content:space-between; gap:8px}
.flash .wordbig{font-family:var(--f-display); font-weight:800; font-size:clamp(2.4rem, 9vw, 5rem); line-height:1.05; overflow-wrap:anywhere; max-width:100%}
.flash .uitleg{font-size:1.15rem; max-width:34em; background:var(--accent-soft); border-radius:14px; padding:14px 18px; overflow-wrap:anywhere}
.flash.again{border-color:var(--hand); box-shadow:0 0 0 3px color-mix(in srgb, var(--hand) 35%, transparent)}
.answer{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.answer .btn{min-height:84px; font-size:1.25rem; border-radius:18px; border-width:2px}
.btn.no{background:var(--bad-soft); border-color:var(--bad-soft); color:var(--bad)}
.btn.yes{background:var(--good); border-color:var(--good); color:#fff}
.keys{text-align:center; font-size:.85rem; color:var(--muted)}
kbd{font-family:inherit; font-weight:700; border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:0 6px; background:var(--surface)}
.missed{display:flex; flex-direction:column; gap:6px}
.missed div{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line)}

@media (max-width:560px){
  .stats{grid-template-columns:repeat(2, minmax(0,1fr))}
  .answer .btn{min-height:72px; font-size:1.1rem}
  .keys{display:none}
}
@media (hover:none){ .keys{display:none} }
@media (prefers-reduced-motion: reduce){ .progress i{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="backup-file" accept=".json,application/json" hidden>

<script>
(function(){
const $app = document.getElementById('app');
const $file = document.getElementById('backup-file');
const LS = 'nmg-oefenen-v1';
const LS_BACKUP = 'nmg-oefenen-laatste-backup';
const ST = {gekend:'Ken ik', bijna:'Bijna', lastig:'Lastig', nieuw:'Nieuw'};
const ORDER = ['gekend','bijna','lastig','nieuw'];
const HAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-ink)" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg>';

const S = {
  lists:new Map(), view:'home', listId:null,
  newList:false, rename:false, bulk:false, editWord:null, wordFilter:'alle', confirm:null,
  setup:{sel:new Set(), filter:'alle', max:0}, quiz:null, msg:null, pendingImport:null
};

const mkId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normWord = w => ({id:String(w.id||mkId()), w:String(w.w||''), g:String(w.g||''), goed:+w.goed||0, fout:+w.fout||0, reeks:+w.reeks||0, laatst:w.laatst||null});
const normList = (id, v) => ({id:String(id), name:String(v.name||'Naamloze lijst'), created:+v.created||0, words:Array.isArray(v.words) ? v.words.map(normWord) : []});
function status(w){ if(w.goed + w.fout === 0) return 'nieuw'; if(w.reeks >= 3) return 'gekend'; if(w.reeks >= 1) return 'bijna'; return 'lastig'; }
function counts(words){ const c={gekend:0,bijna:0,lastig:0,nieuw:0}; for(const w of words) c[status(w)]++; return c; }
const sortedLists = () => [...S.lists.values()].sort((a,b)=>a.created-b.created);
const plural = (n, one, many) => n + ' ' + (n===1 ? one : many);
const fmtDate = iso => { try{ return new Date(iso).toLocaleDateString('nl-NL', {day:'numeric', month:'long', year:'numeric'}); }catch(e){ return ''; } };

/* ---------- opslag op dit apparaat ---------- */
function load(){
  try{ const raw = localStorage.getItem(LS); if(raw){ for(const l of JSON.parse(raw)) if(l && l.id) S.lists.set(String(l.id), normList(l.id, l)); } }
  catch(e){ S.msg = {t:'Je lijsten konden niet worden gelezen.', err:true}; }
  // Vraag de browser om de gegevens niet zelf op te ruimen.
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(sortedLists())); }
  catch(e){ S.msg = {t:'Opslaan op dit apparaat lukt niet. Gebruik je een privévenster?', err:true}; render(); }
}
function lastBackup(){ try{ return localStorage.getItem(LS_BACKUP); }catch(e){ return null; } }

/* ---------- back-up ---------- */
async function makeBackup(){
  const now = new Date();
  const data = {app:'nmg-oefenen', versie:1, gemaakt:now.toISOString(), lijsten:sortedLists()};
  const name = 'nmg-oefenen-backup-' + now.toISOString().slice(0,10) + '.json';
  const file = new File([JSON.stringify(data, null, 1)], name, {type:'application/json'});
  const done = () => { try{ localStorage.setItem(LS_BACKUP, now.toISOString()); }catch(e){} S.msg = {t:'Back-up gemaakt: ' + name}; render(); };
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'NmG Oefenen back-up'});
      done(); return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return; // gebruiker heeft geannuleerd
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  done();
}
$file.addEventListener('change', async () => {
  const f = $file.files && $file.files[0]; $file.value = '';
  if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    if(!data || data.app !== 'nmg-oefenen' || !Array.isArray(data.lijsten)) throw new Error('fout');
    const lists = data.lijsten.filter(l => l && l.id).map(l => normList(l.id, l));
    S.pendingImport = {lists, gemaakt:data.gemaakt};
    S.confirm = 'import'; S.view = 'home'; S.msg = null;
  }catch(e){
    S.msg = {t:'Dit bestand is geen back-up van NmG Oefenen.', err:true};
  }
  render(); window.scrollTo(0, document.body.scrollHeight);
});

/* ---------- weergave ---------- */
function render(opts){
  opts = opts || {};
  const keep = {}; let focusId = null, sS = null, sE = null;
  $app.querySelectorAll('input[id], textarea[id]').forEach(el => { keep[el.id] = el.value; });
  const act = document.activeElement;
  if(act && act.id && $app.contains(act)){ focusId = act.id; try{ sS = act.selectionStart; sE = act.selectionEnd; }catch(e){} }
  $app.innerHTML = '<div class="wrap">' + view() + '</div>';
  const reset = new Set(opts.reset || []);
  for(const k in keep){ if(reset.has(k)) continue; const el = document.getElementById(k); if(el) el.value = keep[k]; }
  const f = opts.focus || focusId;
  if(f){ const el = document.getElementById(f); if(el){ el.focus({preventScroll:!opts.focus}); if(!opts.focus && sS != null){ try{ el.setSelectionRange(sS, sE); }catch(e){} } } }
}
function msgHtml(){
  return S.msg ? `<div class="note${S.msg.err?' err':''}" role="status"><span>${esc(S.msg.t)}</span><button class="btn sm ghost" data-a="dismiss">Sluiten</button></div>` : '';
}
function view(){
  if(S.view === 'list' && S.lists.has(S.listId)) return viewList();
  if(S.view === 'setup') return viewSetup();
  if(S.view === 'quiz' && S.quiz) return viewQuiz();
  if(S.view === 'done' && S.quiz) return viewDone();
  return viewHome();
}
function bar(c, total){
  if(!total) return '<div class="bar"></div>';
  return '<div class="bar" aria-hidden="true">' + ORDER.map(k => c[k] ? `<i class="s-${k}" style="width:${(c[k]/total*100).toFixed(2)}%"></i>` : '').join('') + '</div>';
}
function newListForm(){
  return `<form class="panel" id="f-newlist"><div class="form-row">
    <div class="field"><label for="nl-name">Naam van de lijst</label><input type="text" id="nl-name" placeholder="Bijvoorbeeld: Eten en drinken" autocomplete="off" maxlength="80"></div>
    <button class="btn primary" type="submit">Lijst maken</button><button class="btn ghost" type="button" data-a="newlist-cancel">Annuleren</button>
  </div></form>`;
}
function backupPanel(hasLists){
  let h = `<section class="panel"><h2>Back-up</h2>`;
  if(S.confirm === 'import' && S.pendingImport){
    const p = S.pendingImport;
    const nWords = p.lists.reduce((n, l) => n + l.words.length, 0);
    const overlap = p.lists.filter(l => S.lists.has(l.id)).length;
    h += `<div class="confirm ok"><span>Back-up${p.gemaakt ? ' van ' + esc(fmtDate(p.gemaakt)) : ''} terugzetten: ${plural(p.lists.length,'lijst','lijsten')} met ${plural(nWords,'woord','woorden')}.${overlap ? ' ' + plural(overlap,'lijst','lijsten') + ' die je al hebt, ' + (overlap===1?'wordt':'worden') + ' vervangen door de versie uit de back-up.' : ''} Je andere lijsten blijven staan.</span>
      <div class="row"><button class="btn sm primary" data-a="import-yes">Terugzetten</button><button class="btn sm" data-a="import-no">Annuleren</button></div></div>`;
  } else {
    const lb = lastBackup();
    h += `<p class="muted small">Je lijsten staan alleen op dit apparaat. Maak af en toe een back-up en bewaar die bijvoorbeeld in Bestanden of iCloud Drive. ${hasLists ? (lb ? 'Laatste back-up: ' + esc(fmtDate(lb)) + '.' : 'Je hebt nog geen back-up gemaakt.') : ''}</p>
      <div class="row">${hasLists ? '<button class="btn" data-a="backup">Back-up maken</button>' : ''}<button class="btn" data-a="restore">Back-up terugzetten</button></div>`;
  }
  return h + `</section>`;
}
function viewHome(){
  const lists = sortedLists();
  const all = lists.flatMap(l => l.words);
  const c = counts(all);
  let h = `<header class="row between"><div class="brand"><div class="mark">${HAND}</div><div><h1>NmG Oefenen</h1><p class="muted small">Gebaren oefenen met je eigen woordenlijsten</p></div></div>`;
  if(lists.length) h += `<button class="btn primary big" data-a="setup">Oefenen</button>`;
  h += `</header>` + msgHtml();
  if(!lists.length){
    h += `<section class="panel empty"><div class="mark">${HAND}</div><h2>Nog geen lijsten</h2>
      <p class="muted" style="max-width:32em">Maak een lijst, zet er de woorden in die je wilt oefenen en begin. Bij elk woord kun je ook kort opschrijven hoe het gebaar gaat.</p>
      ${S.newList ? '' : '<div class="row" style="justify-content:center"><button class="btn primary" data-a="newlist">Nieuwe lijst</button><button class="btn" data-a="sample">Voorbeeldlijst toevoegen</button></div>'}
    </section>`;
    if(S.newList) h += newListForm();
    return h + backupPanel(false);
  }
  h += `<section class="stats" aria-label="Voortgang over alle lijsten">
    ${ORDER.map(k => `<div class="stat"><b>${c[k]}</b><span><i class="dot d-${k}"></i>${ST[k]}</span></div>`).join('')}
  </section>`;
  h += `<section style="display:flex;flex-direction:column;gap:12px"><div class="row between"><h2>Mijn lijsten</h2>${S.newList ? '' : '<button class="btn" data-a="newlist">+ Nieuwe lijst</button>'}</div>`;
  if(S.newList) h += newListForm();
  h += `<div class="lists">` + lists.map(l => {
    const lc = counts(l.words);
    return `<button class="card-btn" data-a="open" data-id="${esc(l.id)}"><h3>${esc(l.name)}</h3>
      ${bar(lc, l.words.length)}
      <span class="muted small">${plural(l.words.length,'woord','woorden')}${l.words.length ? ' · ' + lc.gekend + ' ken ik' : ''}${lc.lastig ? ' · ' + lc.lastig + ' lastig' : ''}</span></button>`;
  }).join('') + `</div></section>`;
  h += `<p class="muted small">Een woord staat op <b>Ken ik</b> als je het 3 keer achter elkaar wist. Weet je het een keer niet, dan begint het opnieuw.</p>`;
  return h + backupPanel(true);
}
function viewList(){
  const l = S.lists.get(S.listId);
  const c = counts(l.words);
  let h = `<div class="row"><button class="btn ghost" data-a="home">‹ Lijsten</button></div>`;
  if(S.rename){
    h += `<form class="form-row" id="f-rename"><div class="field"><label for="rn-name">Naam van de lijst</label><input type="text" id="rn-name" value="${esc(l.name)}" maxlength="80" autocomplete="off"></div><button class="btn primary" type="submit">Opslaan</button><button class="btn ghost" type="button" data-a="rename-cancel">Annuleren</button></form>`;
  } else {
    h += `<header class="row between"><div style="min-width:0"><p class="eyebrow">Lijst</p><h1 style="overflow-wrap:anywhere">${esc(l.name)}</h1><p class="muted small">${plural(l.words.length,'woord','woorden')}</p></div>
      <div class="row"><button class="btn ghost sm" data-a="rename">Naam wijzigen</button>${l.words.length ? `<button class="btn primary big" data-a="setup" data-id="${esc(l.id)}">Oefen deze lijst</button>` : ''}</div></header>`;
  }
  h += msgHtml();
  h += `<section class="panel"><div class="row between"><h2>Woorden toevoegen</h2><button class="btn ghost sm" data-a="bulk">${S.bulk ? 'Eén woord tegelijk' : 'Veel woorden tegelijk'}</button></div>`;
  if(S.bulk){
    h += `<form id="f-bulk" style="display:flex;flex-direction:column;gap:10px"><div class="field"><label for="bk-text">Eén woord per regel. Zet na een = hoe het gebaar gaat (mag je weglaten).</label>
      <textarea id="bk-text" placeholder="appel = vuist draaien bij de wang&#10;brood&#10;drinken = hand als beker naar de mond"></textarea></div>
      <div class="row"><button class="btn primary" type="submit">Woorden toevoegen</button></div></form>`;
  } else {
    h += `<form class="form-row" id="f-add"><div class="field"><label for="nw-woord">Woord</label><input type="text" id="nw-woord" autocomplete="off" autocapitalize="off" maxlength="120" placeholder="Bijvoorbeeld: drinken"></div>
      <div class="field" style="flex-basis:260px"><label for="nw-gebaar">Hoe gaat het gebaar? <span class="muted">(mag leeg)</span></label><input type="text" id="nw-gebaar" autocomplete="off" maxlength="400" placeholder="Hand als beker naar de mond"></div>
      <button class="btn primary" type="submit">Toevoegen</button></form>`;
  }
  h += `</section>`;
  if(l.words.length){
    const fl = S.wordFilter;
    h += `<section style="display:flex;flex-direction:column;gap:12px"><div class="chips" role="group" aria-label="Woorden tonen">
      <button class="chip" data-a="wfilter" data-v="alle" aria-pressed="${fl==='alle'}">Alle <span class="n">${l.words.length}</span></button>
      ${['lastig','bijna','nieuw','gekend'].map(k => `<button class="chip" data-a="wfilter" data-v="${k}" aria-pressed="${fl===k}"><i class="dot d-${k}"></i>${ST[k]} <span class="n">${c[k]}</span></button>`).join('')}
    </div>`;
    const ws = l.words.filter(w => fl === 'alle' || status(w) === fl);
    if(!ws.length) h += `<p class="muted">Geen woorden met deze status.</p>`;
    else h += `<div class="words">` + ws.map(w => wordRow(w)).join('') + `</div>`;
    h += `</section>`;
  } else {
    h += `<p class="muted">Deze lijst is nog leeg. Voeg hierboven je eerste woord toe.</p>`;
  }
  h += `<section class="panel"><h2>Beheer</h2>`;
  if(S.confirm === 'reset') h += `<div class="confirm"><span>Voortgang van alle woorden in deze lijst op nul zetten?</span><div class="row"><button class="btn sm danger solid" data-a="confirm-yes">Ja, op nul zetten</button><button class="btn sm" data-a="confirm-no">Nee</button></div></div>`;
  else if(S.confirm === 'list') h += `<div class="confirm"><span>De lijst "${esc(l.name)}" en ${plural(l.words.length,'woord','woorden')} verwijderen? Dit kan niet ongedaan worden.</span><div class="row"><button class="btn sm danger solid" data-a="confirm-yes">Ja, verwijderen</button><button class="btn sm" data-a="confirm-no">Nee</button></div></div>`;
  else h += `<div class="row">${l.words.length ? '<button class="btn" data-a="ask-reset">Voortgang op nul zetten</button>' : ''}<button class="btn danger" data-a="ask-list">Lijst verwijderen</button></div>`;
  h += `</section>`;
  return h;
}
function wordRow(w){
  const s = status(w);
  if(S.editWord === w.id){
    return `<form class="word editing" id="f-edit" data-id="${esc(w.id)}" style="align-items:flex-end">
      <div class="field"><label for="ew-${esc(w.id)}">Woord</label><input type="text" id="ew-${esc(w.id)}" value="${esc(w.w)}" maxlength="120" autocomplete="off"></div>
      <div class="field" style="flex-basis:240px"><label for="eg-${esc(w.id)}">Hoe gaat het gebaar?</label><input type="text" id="eg-${esc(w.id)}" value="${esc(w.g)}" maxlength="400" autocomplete="off"></div>
      <div class="row"><button class="btn primary sm" type="submit">Opslaan</button><button class="btn ghost sm" type="button" data-a="edit-cancel">Annuleren</button></div></form>`;
  }
  if(S.confirm === 'word:' + w.id){
    return `<div class="word confirm" style="border-radius:0"><span>"${esc(w.w)}" verwijderen?</span><div class="row"><button class="btn sm danger solid" data-a="confirm-yes">Verwijderen</button><button class="btn sm" data-a="confirm-no">Nee</button></div></div>`;
  }
  return `<div class="word"><div class="txt"><b>${esc(w.w)}</b>${w.g ? `<p>${esc(w.g)}</p>` : ''}</div>
    <span class="tag t-${s}">${ST[s]}</span>
    <span class="score" title="Aantal keer goed en fout">✓ ${w.goed} · ✗ ${w.fout}</span>
    <div class="row" style="gap:4px"><button class="btn ghost sm" data-a="edit" data-id="${esc(w.id)}">Wijzig</button><button class="btn ghost sm" data-a="ask-word" data-id="${esc(w.id)}" aria-label="Verwijder ${esc(w.w)}">Verwijder</button></div></div>`;
}
function pool(){
  const out = [];
  for(const id of S.setup.sel){
    const l = S.lists.get(id); if(!l) continue;
    for(const w of l.words){
      const s = status(w);
      if(S.setup.filter === 'niet' && s === 'gekend') continue;
      if(S.setup.filter === 'lastig' && s !== 'lastig') continue;
      out.push({l:id, w:w.id});
    }
  }
  return out;
}
function viewSetup(){
  const lists = sortedLists();
  for(const id of [...S.setup.sel]) if(!S.lists.has(id)) S.setup.sel.delete(id);
  const p = pool();
  const n = S.setup.max ? Math.min(S.setup.max, p.length) : p.length;
  const allSel = lists.length && lists.every(l => S.setup.sel.has(l.id));
  let h = `<div class="row"><button class="btn ghost" data-a="home">‹ Lijsten</button></div><header><h1>Oefenen</h1><p class="muted">Kies wat je wilt oefenen. De woorden komen in willekeurige volgorde.</p></header>` + msgHtml();
  h += `<section class="panel"><div class="row between"><h2>Welke lijsten?</h2><button class="btn ghost sm" data-a="sel-all">${allSel ? 'Niets kiezen' : 'Alles kiezen'}</button></div>
    <div class="chips">${lists.map(l => `<button class="chip" data-a="sel" data-id="${esc(l.id)}" aria-pressed="${S.setup.sel.has(l.id)}">${esc(l.name)} <span class="n">${l.words.length}</span></button>`).join('')}</div></section>`;
  const fopts = [['alle','Alle woorden'],['niet','Wat ik nog niet ken'],['lastig','Alleen lastige']];
  h += `<section class="panel"><h2>Welke woorden?</h2><div class="chips">${fopts.map(([v,t]) => `<button class="chip" data-a="sfilter" data-v="${v}" aria-pressed="${S.setup.filter===v}">${t}</button>`).join('')}</div></section>`;
  const mopts = [[0,'Allemaal'],[10,'10'],[20,'20'],[40,'40']];
  h += `<section class="panel"><h2>Hoeveel woorden?</h2><div class="chips">${mopts.map(([v,t]) => `<button class="chip" data-a="smax" data-v="${v}" aria-pressed="${S.setup.max===v}">${t}</button>`).join('')}</div></section>`;
  h += `<div class="row between"><span class="muted">${S.setup.sel.size ? (n ? plural(n,'woord','woorden') + ' in deze ronde' : 'Geen woorden die hierbij passen') : 'Kies minstens één lijst'}</span>
    <button class="btn primary big" data-a="start" ${n ? '' : 'disabled'}>Start</button></div>`;
  return h;
}
function findWord(it){ const l = S.lists.get(it.l); return l ? l.words.find(w => w.id === it.w) : null; }
function viewQuiz(){
  const q = S.quiz;
  while(q.queue.length && !findWord(q.queue[0])){ q.queue.shift(); q.total = Math.max(q.done, q.total - 1); }
  if(!q.queue.length){ S.view = 'done'; return viewDone(); }
  const it = q.queue[0], w = findWord(it), l = S.lists.get(it.l);
  const key = it.l + ':' + it.w, again = q.missed.has(key);
  const pct = q.total ? (q.done / q.total * 100) : 0;
  return `<div class="quiz"><div class="row between"><button class="btn ghost" data-a="stop">Stoppen</button>
    <span class="muted small" style="font-variant-numeric:tabular-nums">${q.done} van ${q.total} gekend · nog ${q.queue.length}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${q.total}" aria-valuenow="${q.done}" aria-label="Voortgang van deze ronde"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="flash${again ? ' again' : ''}" aria-live="polite">
      <div class="from"><span class="eyebrow">${esc(l ? l.name : '')}</span>${again ? '<span class="tag t-lastig">Nog een keer</span>' : ''}</div>
      <div class="wordbig">${esc(w.w)}</div>
      ${w.g ? (q.revealed ? `<div class="uitleg">${esc(w.g)}</div>` : `<button class="btn" data-a="reveal">Toon hoe het gebaar gaat</button>`) : ''}
    </div>
    <div class="answer"><button class="btn no" data-a="no">Weet ik niet</button><button class="btn yes" data-a="yes">Weet ik</button></div>
    <p class="keys">Toetsen: <kbd>←</kbd> weet ik niet · <kbd>→</kbd> weet ik${w.g ? ' · <kbd>spatie</kbd> toon gebaar' : ''}</p></div>`;
}
function viewDone(){
  const q = S.quiz;
  const missed = [...q.missed.entries()].map(([k, n]) => { const [l, w] = k.split(':'); return {it:{l, w}, n}; }).filter(x => findWord(x.it));
  const finished = !q.queue.length;
  let h = `<header><p class="eyebrow">${finished ? 'Ronde klaar' : 'Gestopt'}</p><h1>${finished ? 'Goed gedaan!' : 'Tot zover'}</h1></header>`;
  h += `<section class="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    <div class="stat"><b>${q.firstTry}</b><span>in één keer goed</span></div>
    <div class="stat"><b>${missed.length}</b><span>moest je herhalen</span></div>
    <div class="stat"><b>${q.done}</b><span>van ${q.total} gekend</span></div></section>`;
  if(missed.length){
    h += `<section class="panel"><h2>Deze woorden waren lastig</h2><div class="missed">` +
      missed.sort((a,b)=>b.n-a.n).map(x => `<div><b>${esc(findWord(x.it).w)}</b><span class="muted small">${x.n} keer niet geweten</span></div>`).join('') + `</div></section>`;
  }
  h += `<div class="row">${missed.length ? '<button class="btn primary big" data-a="again-missed">Oefen de lastige woorden</button>' : ''}
    <button class="btn${missed.length ? '' : ' primary'} big" data-a="again">Nog een ronde</button><button class="btn big" data-a="home">Naar lijsten</button></div>`;
  return h;
}

/* ---------- acties ---------- */
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startQuiz(items){
  S.quiz = {queue:shuffle(items.slice()), total:items.length, done:0, firstTry:0, missed:new Map(), revealed:false};
  S.view = 'quiz'; window.scrollTo(0,0); render();
}
function answer(known){
  const q = S.quiz; if(!q || !q.queue.length) return;
  const it = q.queue.shift(); const w = findWord(it);
  if(!w){ render(); return; }
  if(known){ w.goed++; w.reeks++; } else { w.fout++; w.reeks = 0; }
  w.laatst = new Date().toISOString();
  save();
  const key = it.l + ':' + it.w;
  if(known){ q.done++; if(!q.missed.has(key)) q.firstTry++; }
  else {
    q.missed.set(key, (q.missed.get(key) || 0) + 1);
    // Niet geweten: een paar kaarten later komt het woord terug.
    const pos = Math.min(q.queue.length, 2 + Math.floor(Math.random() * 3));
    q.queue.splice(pos, 0, it);
  }
  q.revealed = false;
  if(!q.queue.length) S.view = 'done';
  render();
}
function createList(name){
  const id = mkId();
  S.lists.set(id, {id, name, created:Date.now(), words:[]});
  save(); return id;
}
function addWords(l, items){
  const have = new Set(l.words.map(w => w.w.trim().toLowerCase()));
  let added = 0, skipped = 0;
  for(const {w, g} of items){
    const k = w.trim().toLowerCase(); if(!k) continue;
    if(have.has(k)){ skipped++; continue; }
    have.add(k); l.words.push(normWord({w:w.trim(), g:g.trim()})); added++;
  }
  if(added) save();
  return {added, skipped};
}

$app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b || !$app.contains(b)) return;
  const a = b.dataset.a, id = b.dataset.id, v = b.dataset.v;
  const l = S.lists.get(S.listId);
  switch(a){
    case 'dismiss': S.msg = null; break;
    case 'home': S.view = 'home'; S.confirm = null; S.editWord = null; S.rename = false; S.newList = false; S.quiz = null; window.scrollTo(0,0); break;
    case 'newlist': S.newList = true; render({focus:'nl-name'}); return;
    case 'newlist-cancel': S.newList = false; break;
    case 'sample': {
      const nid = createList('Voorbeeld: begroeten');
      addWords(S.lists.get(nid), ['hallo','dag','goedemorgen','welterusten','dank je wel','alsjeblieft','sorry','ja','nee','hoe gaat het'].map(w => ({w, g:''})));
      S.msg = {t:'Voorbeeldlijst toegevoegd. Open hem om bij elk woord te schrijven hoe het gebaar gaat.'};
      break;
    }
    case 'backup': makeBackup(); return;
    case 'restore': $file.click(); return;
    case 'import-no': S.pendingImport = null; S.confirm = null; break;
    case 'import-yes': {
      const p = S.pendingImport;
      if(p){ for(const nl of p.lists) S.lists.set(nl.id, nl); save(); S.msg = {t:plural(p.lists.length,'lijst','lijsten') + ' teruggezet.'}; }
      S.pendingImport = null; S.confirm = null; window.scrollTo(0,0); break;
    }
    case 'open': S.view = 'list'; S.listId = id; S.confirm = null; S.editWord = null; S.rename = false; S.wordFilter = 'alle'; S.msg = null; window.scrollTo(0,0); break;
    case 'rename': S.rename = true; render({focus:'rn-name'}); return;
    case 'rename-cancel': S.rename = false; break;
    case 'bulk': S.bulk = !S.bulk; render({focus: S.bulk ? 'bk-text' : 'nw-woord'}); return;
    case 'wfilter': S.wordFilter = v; break;
    case 'edit': S.editWord = id; S.confirm = null; render({focus:'ew-' + id}); return;
    case 'edit-cancel': S.editWord = null; break;
    case 'ask-word': S.confirm = 'word:' + id; S.editWord = null; break;
    case 'ask-reset': S.confirm = 'reset'; break;
    case 'ask-list': S.confirm = 'list'; break;
    case 'confirm-no': S.confirm = null; break;
    case 'confirm-yes': {
      if(!l) break;
      if(S.confirm === 'reset'){ for(const w of l.words){ w.goed = 0; w.fout = 0; w.reeks = 0; w.laatst = null; } save(); S.msg = {t:'De voortgang van deze lijst staat weer op nul.'}; }
      else if(S.confirm === 'list'){ S.lists.delete(l.id); save(); S.setup.sel.delete(l.id); S.view = 'home'; S.msg = {t:'Lijst verwijderd.'}; }
      else if(S.confirm && S.confirm.startsWith('word:')){ const wid = S.confirm.slice(5); l.words = l.words.filter(w => w.id !== wid); save(); }
      S.confirm = null; break;
    }
    case 'setup':
      S.setup.sel = new Set(id ? [id] : (S.setup.sel.size ? [...S.setup.sel] : sortedLists().map(x => x.id)));
      S.view = 'setup'; S.msg = null; S.confirm = null; window.scrollTo(0,0); break;
    case 'sel': S.setup.sel.has(id) ? S.setup.sel.delete(id) : S.setup.sel.add(id); break;
    case 'sel-all': { const ls = sortedLists(); const all = ls.every(x => S.setup.sel.has(x.id)); S.setup.sel = new Set(all ? [] : ls.map(x => x.id)); break; }
    case 'sfilter': S.setup.filter = v; break;
    case 'smax': S.setup.max = +v; break;
    case 'start': { const p = shuffle(pool()); startQuiz(S.setup.max ? p.slice(0, S.setup.max) : p); return; }
    case 'reveal': if(S.quiz) S.quiz.revealed = true; break;
    case 'yes': answer(true); return;
    case 'no': answer(false); return;
    case 'stop': S.view = 'done'; break;
    case 'again': S.view = 'setup'; S.quiz = null; break;
    case 'again-missed': { const items = [...S.quiz.missed.keys()].map(k => { const [ll, w] = k.split(':'); return {l:ll, w}; }).filter(findWord); startQuiz(items); return; }
  }
  render();
});

$app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, l = S.lists.get(S.listId);
  if(f.id === 'f-newlist'){
    const name = document.getElementById('nl-name').value.trim();
    if(!name){ document.getElementById('nl-name').focus(); return; }
    const id = createList(name); S.newList = false;
    S.view = 'list'; S.listId = id; S.bulk = false; S.wordFilter = 'alle'; S.msg = null;
    render({reset:['nl-name'], focus:'nw-woord'}); return;
  }
  if(!l) return;
  if(f.id === 'f-rename'){
    const name = document.getElementById('rn-name').value.trim();
    if(name){ l.name = name; save(); }
    S.rename = false; render(); return;
  }
  if(f.id === 'f-add'){
    const w = document.getElementById('nw-woord').value, g = document.getElementById('nw-gebaar').value;
    if(!w.trim()){ document.getElementById('nw-woord').focus(); return; }
    const r = addWords(l, [{w, g}]);
    S.msg = r.added ? null : {t:'"' + w.trim() + '" staat al in deze lijst.', err:true};
    render({reset:r.added ? ['nw-woord','nw-gebaar'] : [], focus:'nw-woord'}); return;
  }
  if(f.id === 'f-bulk'){
    const lines = document.getElementById('bk-text').value.split(/\r?\n/);
    const items = lines.map(s => { const i = s.indexOf('='); return i >= 0 ? {w:s.slice(0,i), g:s.slice(i+1)} : {w:s, g:''}; }).filter(x => x.w.trim());
    if(!items.length){ document.getElementById('bk-text').focus(); return; }
    const r = addWords(l, items);
    S.msg = {t: plural(r.added,'woord','woorden') + ' toegevoegd' + (r.skipped ? ', ' + r.skipped + ' stond' + (r.skipped===1?'':'en') + ' er al in' : '') + '.'};
    S.bulk = false; render({reset:['bk-text']}); return;
  }
  if(f.id === 'f-edit'){
    const wid = f.dataset.id, w = l.words.find(x => x.id === wid); if(!w) return;
    const nw = document.getElementById('ew-' + wid).value.trim(), ng = document.getElementById('eg-' + wid).value.trim();
    if(!nw) return;
    w.w = nw; w.g = ng; save(); S.editWord = null; render(); return;
  }
});

document.addEventListener('keydown', e => {
  if(S.view !== 'quiz' || !S.quiz) return;
  const t = e.target; if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); answer(true); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); answer(false); }
  else if(e.key === ' '){ e.preventDefault(); if(!S.quiz.revealed){ S.quiz.revealed = true; render(); } }
});

load();
render();

// Offline werken: de app zelf wordt op het apparaat bewaard.
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
